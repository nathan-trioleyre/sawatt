# Gradle daemon JVM: Android lint needs plenty of memory.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Reuse task outputs already computed (locally, and in CI through the cache).
org.gradle.caching=true
# Run tasks of independent modules in parallel.
org.gradle.parallel=true
# Skip project configuration when nothing changed.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
