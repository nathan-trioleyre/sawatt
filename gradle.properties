# JVM du démon Gradle : le lint Android est gourmand en mémoire.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Réutilise les sorties de tâches déjà calculées (localement et en CI via le cache).
org.gradle.caching=true
# Exécute les tâches des modules indépendants en parallèle.
org.gradle.parallel=true
# Évite de reconfigurer le projet quand rien n'a changé.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
